<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salary Month</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3a4bc8">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#e9eef4;--card:#fff;--ink:#17202c;--mute:#667385;--line:#d7dfe8;--acc:#3a4bc8;--ok:#1b8a57;--warn:#c27d00;--bad:#c23a3a;--r:16px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--card:#19212b;--ink:#e8edf3;--mute:#93a0b1;--line:#2a3441;--acc:#8d9bff;--ok:#4cc88a;--warn:#e8b13c;--bad:#f07a7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151c;--card:#19212b;--ink:#e8edf3;--mute:#93a0b1;--line:#2a3441;--acc:#8d9bff;--ok:#4cc88a;--warn:#e8b13c;--bad:#f07a7a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:480px;margin:0 auto;padding:12px 14px 90px}
h1,h2,h3{margin:0;font-weight:800}
.top{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}
.top h1{font-size:20px}
.mn{display:flex;align-items:center;gap:6px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:9px 14px;background:var(--acc);color:#fff;font-weight:600}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.sm{padding:4px 10px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.card h2{font-size:15px;margin-bottom:10px}
.verdict{text-align:center}
.verdict svg{width:100%;max-width:260px}
.pill{display:inline-block;padding:3px 12px;border-radius:99px;font-weight:800;font-size:14px;color:#fff}
.s-safe{background:var(--ok)}.s-watch{background:var(--warn)}.s-over{background:var(--bad)}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;text-align:left}
.nums div{background:var(--bg);border-radius:12px;padding:10px}
.nums small{display:block;color:var(--mute);font-size:12px}
.nums b{font-size:17px}
.bar{display:grid;grid-template-columns:84px 1fr auto;gap:8px;align-items:center;margin:8px 0;font-size:14px}
.track{height:10px;background:var(--bg);border-radius:6px;overflow:hidden}
.fill{height:100%;background:var(--acc);border-radius:6px}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
input,select{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item small{color:var(--mute);display:block}
.neg{font-weight:800}
.empty{color:var(--mute);text-align:center;padding:14px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;max-width:150px;background:transparent;color:var(--mute)}
nav button.on{background:var(--bg);color:var(--acc)}
.note{font-size:13px;color:var(--mute)}
.due{border-left:4px solid var(--warn);padding-left:10px}
svg text{fill:var(--mute);font-size:9px;font-family:inherit}
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Salary Month</h1>
    <div class="mn"><button class="ghost sm" id="prev" aria-label="Previous month">‹</button><b id="mlabel"></b><button class="ghost sm" id="next" aria-label="Next month">›</button></div>
  </div>
  <section id="v-over"></section>
  <section id="v-spend" hidden></section>
  <section id="v-rem" hidden></section>
</main>
<nav>
  <button data-t="over" class="on">Overview</button>
  <button data-t="spend">Spending</button>
  <button data-t="rem">Reminders</button>
</nav>
<script>
const CATS=['Rent','Travel','Amenities','Daily','Other'];
const KEY='salary-month-v1';
let S={salary:0,save:20,cur:'₹',sal:{},exp:[],rem:[],last:''};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
let pushT;
const push=()=>{fetch('api/data',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(S)}).catch(()=>{})};
const persist=()=>{S.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}clearTimeout(pushT);pushT=setTimeout(push,400)};
async function init(){
  try{
    const r=await fetch('api/data',{cache:'no-store'});
    if(r.ok){const d=await r.json();
      if((d.ts||0)>(S.ts||0)){S=Object.assign(S,d);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
      else if((S.ts||0)>(d.ts||0))push();}
  }catch(e){}
  render();
}
const today=new Date();
let view=new Date(today.getFullYear(),today.getMonth(),1);
let tab='over';
const ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const $=id=>document.getElementById(id);
const money=n=>S.cur+Math.round(n).toLocaleString('en-IN');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const salaryFor=k=>S.sal[k]!=null?S.sal[k]:S.salary;
function calc(){
  const k=ym(view),dim=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
  const isNow=k===ym(today),past=view<new Date(today.getFullYear(),today.getMonth(),1);
  const el=isNow?today.getDate():(past?dim:0);
  const list=S.exp.filter(e=>e.date.startsWith(k));
  const spent=list.reduce((a,e)=>a+e.amt,0);
  const by={};CATS.forEach(c=>by[c]=0);list.forEach(e=>by[e.cat]+=e.amt);
  const daily=list.filter(e=>e.cat==='Daily').reduce((a,e)=>a+e.amt,0);
  const sal=salaryFor(k);
  let proj=spent;
  if(isNow&&el>0)proj=spent+(daily/el)*(dim-el);
  const t=1-S.save/100,ratio=sal>0?proj/sal:0;
  let score=sal>0?Math.max(0,Math.min(100,Math.round(60+(t-ratio)*200))):0;
  let st=ratio<=t?'safe':ratio<=1?'watch':'over';
  return{k,dim,el,isNow,list,spent,by,sal,proj,ratio,score,st,left:sal-spent};
}
function gauge(c){
  const L=251.3,p=c.score/100*L,col=c.st==='safe'?'var(--ok)':c.st==='watch'?'var(--warn)':'var(--bad)';
  return `<svg viewBox="0 0 200 120" role="img" aria-label="Balance score ${c.score} out of 100"><path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="var(--line)" stroke-width="16" stroke-linecap="round"/><path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="${col}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${p} ${L}"/><text x="100" y="92" text-anchor="middle" style="font-size:38px;font-weight:800;fill:var(--ink)">${c.score}</text><text x="100" y="112" text-anchor="middle" style="font-size:11px">balance score</text></svg>`;
}
function line(c){
  if(c.sal<=0)return'';
  const W=320,H=140,pl=8,pr=8,pt=10,pb=18,max=Math.max(c.sal,c.proj,c.spent)*1.05;
  const x=d=>pl+(d-1)/(c.dim-1)*(W-pl-pr),y=v=>pt+(1-v/max)*(H-pt-pb);
  let cum=0,pts=[[1,0]];const per=Array(c.dim+1).fill(0);
  c.list.forEach(e=>per[+e.date.slice(8,10)]+=e.amt);
  for(let d=1;d<=c.el;d++){cum+=per[d];pts.push([d,cum])}
  const path=pts.map((p,i)=>(i?'L':'M')+x(p[0]).toFixed(1)+' '+y(p[1]).toFixed(1)).join('');
  const proj=c.isNow&&c.el<c.dim?`<path d="M${x(c.el).toFixed(1)} ${y(c.spent).toFixed(1)}L${x(c.dim).toFixed(1)} ${y(c.proj).toFixed(1)}" stroke="var(--acc)" stroke-width="2" stroke-dasharray="4 4" fill="none"/>`:'';
  const tY=y(c.sal*(1-S.save/100));
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Spending through the month"><line x1="${pl}" x2="${W-pr}" y1="${y(c.sal)}" y2="${y(c.sal)}" stroke="var(--bad)" stroke-width="1.2"/><text x="${pl+2}" y="${y(c.sal)-3}">salary</text><line x1="${pl}" x2="${W-pr}" y1="${tY}" y2="${tY}" stroke="var(--ok)" stroke-width="1.2" stroke-dasharray="3 3"/><text x="${pl+2}" y="${tY-3}">safe limit</text><path d="${path}" stroke="var(--acc)" stroke-width="2.5" fill="none"/>${proj}<text x="${pl}" y="${H-4}">1</text><text x="${W-pr}" y="${H-4}" text-anchor="end">${c.dim}</text></svg>`;
}
function overview(){
  const c=calc(),el=$('v-over');
  const msg={safe:'You are on track to save your target this month.',watch:'You will cover the month, but your savings target is at risk.',over:'At this pace you will spend more than your salary.'}[c.st];
  const lab={safe:'Safe',watch:'Watch out',over:'Not safe'}[c.st];
  const due=dueList(c.k);
  let h='';
  if(c.sal<=0)h+=`<div class="card"><h2>Start here</h2><p class="note" style="margin:0 0 6px">Enter your monthly salary to see your score.</p></div>`;
  else h+=`<div class="card verdict">${gauge(c)}<div><span class="pill s-${c.st==='safe'?'safe':c.st==='watch'?'watch':'over'}">${lab}</span></div><p style="margin:8px 0 0">${msg}</p>
  <div class="nums"><div><small>Salary</small><b>${money(c.sal)}</b></div><div><small>Spent</small><b>${money(c.spent)}</b></div><div><small>Left now</small><b style="color:${c.left<0?'var(--bad)':'inherit'}">${money(c.left)}</b></div><div><small>Expected month-end spend</small><b>${money(c.proj)}</b></div></div></div>`;
  if(due.length)h+=`<div class="card due"><h2>Coming up</h2>${due.map(r=>`<div class="item"><div>${esc(r.title)}<small>${r.amt?money(r.amt)+' · ':''}due on day ${r.day}</small></div><button class="sm" data-paid="${r.id}">Mark paid</button></div>`).join('')}</div>`;
  if(c.sal>0)h+=`<div class="card"><h2>Spending through the month</h2>${line(c)}<p class="note" style="margin:4px 0 0">Dashed blue shows where daily spending is heading.</p></div>`;
  const mx=Math.max(1,...CATS.map(k=>c.by[k]));
  h+=`<div class="card"><h2>Where it went</h2>${CATS.map(k=>`<div class="bar"><span>${k}</span><div class="track"><div class="fill" style="width:${c.by[k]/mx*100}%"></div></div><b>${money(c.by[k])}</b></div>`).join('')}</div>`;
  h+=`<div class="card"><h2>Settings</h2><div class="row2"><div><label for="sal">Salary this month</label><input id="sal" type="number" inputmode="decimal" value="${c.sal||''}" placeholder="0"></div><div><label for="sv">Savings goal %</label><input id="sv" type="number" inputmode="decimal" value="${S.save}"></div></div><label for="cur">Currency symbol</label><input id="cur" value="${esc(S.cur)}" maxlength="3"><p style="margin:12px 0 0"><button id="saveset">Save settings</button></p><p style="margin:10px 0 0"><button class="ghost" id="exp">Export backup</button> <button class="ghost" id="imp">Import backup</button><input id="impf" type="file" accept=".json,application/json" hidden></p><p class="note" style="margin:8px 0 0">Backup is a JSON file you can keep or move to another device.</p></div>`;
  el.innerHTML=h;
  $('saveset').onclick=()=>{const v=parseFloat($('sal').value)||0;S.salary=v;S.sal[c.k]=v;S.save=Math.min(90,Math.max(0,parseFloat($('sv').value)||0));S.cur=$('cur').value||'₹';persist();render()};
  $('exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='salary-month-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
  $('imp').onclick=()=>$('impf').click();
  $('impf').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!Array.isArray(d.exp))throw 0;S=Object.assign(S,d);persist();render()}catch(x){alert('That file is not a Salary Month backup.')}})};
  el.querySelectorAll('[data-paid]').forEach(b=>b.onclick=()=>{const r=S.rem.find(x=>x.id===b.dataset.paid);r.paid=r.paid||{};r.paid[c.k]=true;persist();render()});
}
function spending(){
  const c=calc(),el=$('v-spend');
  const d=ym(today)===c.k?today.getDate():1;
  const dv=c.k+'-'+String(d).padStart(2,'0');
  const sorted=[...c.list].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  el.innerHTML=`<div class="card"><h2>Add spending</h2><div class="row2"><div><label for="a">Amount</label><input id="a" type="number" inputmode="decimal" placeholder="0"></div><div><label for="c">Type</label><select id="c">${CATS.map(k=>`<option>${k}</option>`).join('')}</select></div></div><label for="n">What was it for?</label><input id="n" placeholder="e.g. auto fare, groceries"><label for="d">Date</label><input id="d" type="date" value="${dv}"><p style="margin:12px 0 0"><button id="add">Add spending</button></p></div>
  <div class="card"><h2>What you spent on</h2>${sorted.length?sorted.map(e=>`<div class="item"><div>${esc(e.note||e.cat)}<small>${e.cat} · ${e.date.slice(8,10)}/${e.date.slice(5,7)}</small></div><div><span class="neg">${money(e.amt)}</span> <button class="ghost sm" data-del="${e.id}" aria-label="Delete">✕</button></div></div>`).join(''):'<div class="empty">Nothing added for this month yet.</div>'}</div>`;
  $('add').onclick=()=>{const amt=parseFloat($('a').value);if(!(amt>0)){$('a').focus();return}
    const dt=$('d').value||dv;S.exp.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),amt,cat:$('c').value,note:$('n').value.trim(),date:dt});persist();render()};
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{S.exp=S.exp.filter(e=>e.id!==b.dataset.del);persist();render()});
}
function dueList(k){
  if(k!==ym(today))return[];
  return S.rem.filter(r=>!(r.paid&&r.paid[k])&&r.day-today.getDate()<=3).sort((a,b)=>a.day-b.day);
}
function reminders(){
  const el=$('v-rem');
  el.innerHTML=`<div class="card"><h2>Add a monthly reminder</h2><label for="rt">Title</label><input id="rt" placeholder="e.g. Pay rent"><div class="row2"><div><label for="rd">Day of month</label><input id="rd" type="number" min="1" max="31" inputmode="numeric" placeholder="1"></div><div><label for="ra">Amount (optional)</label><input id="ra" type="number" inputmode="decimal"></div></div><p style="margin:12px 0 0"><button id="radd">Add reminder</button></p></div>
  <div class="card"><h2>Your reminders</h2>${S.rem.length?S.rem.sort((a,b)=>a.day-b.day).map(r=>`<div class="item"><div>${esc(r.title)}<small>Day ${r.day} each month${r.amt?' · '+money(r.amt):''}</small></div><button class="ghost sm" data-rd="${r.id}" aria-label="Delete">✕</button></div>`).join(''):'<div class="empty">No reminders yet.</div>'}</div>
  <div class="card"><h2>Phone alerts</h2><p class="note" style="margin-top:0">Reminders due in the next 3 days appear on Overview. A phone alert is also sent when you open the app, if you allow it. Browsers cannot ring in the background, so this is not a timed alarm.</p><button class="ghost" id="perm">Allow alerts</button></div>`;
  $('radd').onclick=()=>{const t=$('rt').value.trim(),d=parseInt($('rd').value);if(!t||!(d>=1&&d<=31))return;S.rem.push({id:Date.now().toString(36),title:t,day:d,amt:parseFloat($('ra').value)||0,paid:{}});persist();render()};
  el.querySelectorAll('[data-rd]').forEach(b=>b.onclick=()=>{S.rem=S.rem.filter(r=>r.id!==b.dataset.rd);persist();render()});
  $('perm').onclick=()=>{try{Notification.requestPermission().then(p=>{$('perm').textContent=p==='granted'?'Alerts allowed':'Alerts blocked';notify()})}catch(e){$('perm').textContent='Not supported here'}};
}
function notify(){
  try{
    const key=ym(today)+'-'+today.getDate();
    if(S.last===key||Notification.permission!=='granted')return;
    const d=dueList(ym(today));if(!d.length)return;
    navigator.serviceWorker.ready.then(g=>g.showNotification('Payments due soon',{body:d.map(r=>r.title+' (day '+r.day+')').join(', '),icon:'icon-192.png'}));
    S.last=key;persist();
  }catch(e){}
}
function render(){
  $('mlabel').textContent=view.toLocaleString('en',{month:'short',year:'numeric'});
  ['over','spend','rem'].forEach(t=>$('v-'+t).hidden=t!==tab);
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  if(tab==='over')overview();else if(tab==='spend')spending();else reminders();
}
$('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};
$('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();window.scrollTo(0,0)});
render();init().then(notify);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
